<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savanna Terrain</title>
<style>
  html, body { margin: 0; height: 100%; background: #f2b25a; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #bar { position: fixed; left: 8px; top: 8px; display: flex; gap: 4px; background: #2b2b2b; padding: 5px; border-radius: 6px; }
  button { background: #444; color: #fff; border: 1px solid #666; padding: 6px 12px; border-radius: 4px; cursor: pointer; font: inherit; }
  button.on { background: #e8b73a; color: #000; border-color: #e8b73a; }
  #hud { position: fixed; left: 8px; bottom: 8px; background: #2b2b2b; color: #ddd; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f2b25a; color: #3a2210; font-size: 18px; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="hud"></div>
<div id="loading">Building the savanna...</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
